name: Запуск бота

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Запуск бота
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python main.py
